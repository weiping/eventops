name: Tests
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: ruff check scripts tests
      - run: python3 -m pytest tests -q
      - name: Every issue-form label must map to a parser key
        run: python3 -m scripts.check_form_contract
